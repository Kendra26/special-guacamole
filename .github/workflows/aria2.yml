name: Torrent Download & Smart Upload to Filemirage

on:
  push:
    branches:
      - '*'
  workflow_dispatch:

jobs:
  torrent-upload:
    runs-on: ubuntu-latest
    env:
      FILEMIRAGE_API_TOKEN: '9QQH-DGES-CWQZ-FXNV'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt update && sudo apt install -y python3 python3-requests aria2

      - name: Download, Zip Conditions & Upload
        run: |
          python3 - << 'EOF'
          import os
          import re
          import sys
          import time
          import zipfile
          import tempfile
          import subprocess
          import urllib.request
          import requests
          from datetime import datetime

          PAGE_URL = "https://equestria-eta.vercel.app/api/pages/dprjjMvC8fCF/raw"
          FILEMIRAGE_TOKEN = os.environ.get("FILEMIRAGE_API_TOKEN", "")

          def zip_files(file_paths, zip_output_path):
              with zipfile.ZipFile(zip_output_path, 'w', zipfile.ZIP_DEFLATED) as zipf:
                  for fpath in file_paths:
                      zipf.write(fpath, os.path.basename(fpath))

          def main():
              # 1. Create temporary directory
              temp_dir = tempfile.mkdtemp(prefix="torrent_download_")
              print(f"Downloading files to temporary folder: {temp_dir}")

              # 2. Fetch magnet links
              print("Fetching magnet links...")
              req = urllib.request.Request(PAGE_URL, headers={"User-Agent": "Mozilla/5.0"})
              try:
                  with urllib.request.urlopen(req) as response:
                      lines = response.read().decode("utf-8").splitlines()
              except Exception as e:
                  print(f"Failed to fetch page: {e}")
                  sys.exit(1)

              links = [line.strip() for line in lines if line.strip() and not line.startswith("#")]
              if not links:
                  print("No magnet links found.")
                  return

              # 3. Download torrents using aria2c
              links_file = os.path.join(temp_dir, "links.txt")
              with open(links_file, "w", encoding="utf-8") as f:
                  f.write("\n".join(links))

              print(f"Starting aria2c download for {len(links)} magnet link(s)...")
              aria2_cmd = [
                  "aria2c",
                  f"--dir={temp_dir}",
                  f"--input-file={links_file}",
                  "--seed-time=0",
                  "--summary-interval=5",
                  "--console-log-level=notice"
              ]

              res = subprocess.run(aria2_cmd)
              if res.returncode != 0:
                  print(f"aria2c failed with return code {res.returncode}")
                  sys.exit(1)

              if os.path.exists(links_file):
                  os.remove(links_file)

              print("\nAll downloads finished!")

              # 4. Process files based on series detection and count rules
              all_files = []
              for root, _, files in os.walk(temp_dir):
                  for f in files:
                      all_files.append(os.path.join(root, f))

              series_regex = re.compile(r'^(.*?)[._\s-]+(?:[sS]\d+|\d+[xX]\d+|season\s*\d+|ep?\d+)', re.IGNORECASE)
              series_groups = {}
              non_series_files = []

              for fpath in all_files:
                  fname = os.path.basename(fpath)
                  match = series_regex.match(fname)
                  if match:
                      show_title = re.sub(r'[._-]+', ' ', match.group(1)).strip().lower()
                      if show_title not in series_groups:
                          series_groups[show_title] = []
                      series_groups[show_title].append(fpath)
                  else:
                      non_series_files.append(fpath)

              final_upload_files = []
              small_series_files = []

              # Process Series files
              for show_title, files in series_groups.items():
                  if len(files) > 3:
                      # More than 3 files: Zip together into show-named zip
                      files.sort()
                      first_file_stem = os.path.splitext(os.path.basename(files[0]))[0]
                      zip_name = os.path.join(temp_dir, f"{first_file_stem}.zip")
                      print(f"Series '{show_title}' has {len(files)} files (>3). Zipping into '{first_file_stem}.zip'...")
                      zip_files(files, zip_name)
                      final_upload_files.append(zip_name)
                  else:
                      # 3 or fewer files: Collect together to zip in a single timestamped archive
                      print(f"Series '{show_title}' has {len(files)} file(s) (<=3). Adding to combined zip...")
                      small_series_files.extend(files)

              # Bundle all <=3 series files across all shows into ONE timestamped zip
              if small_series_files:
                  timestamp = datetime.now().strftime("%Y%m%d_%H%M%S")
                  combined_zip_name = os.path.join(temp_dir, f"{timestamp}.zip")
                  print(f"Zipping {len(small_series_files)} ungrouped series file(s) into single archive '{timestamp}.zip'...")
                  zip_files(small_series_files, combined_zip_name)
                  final_upload_files.append(combined_zip_name)

              # Process Non-Series files (uploaded normally unzipped)
              final_upload_files.extend(non_series_files)

              # 5. Fetch Filemirage server and upload items
              print("\nFetching Filemirage server...")
              try:
                  srv_resp = requests.get("https://filemirage.com/api/servers").json()
                  server = srv_resp.get("data", {}).get("server")
              except Exception as e:
                  print(f"Error connecting to Filemirage API: {e}")
                  sys.exit(1)

              if not server:
                  print("Failed to get valid Filemirage server.")
                  sys.exit(1)

              headers = {"Authorization": f"Bearer {FILEMIRAGE_TOKEN}"}
              print(f"\nUploading {len(final_upload_files)} item(s) to Filemirage...")

              has_failed = False
              for file_path in final_upload_files:
                  if not os.path.isfile(file_path):
                      continue
                  file_name = os.path.basename(file_path)
                  print(f"Uploading: {file_name}")

                  try:
                      with open(file_path, "rb") as f:
                          res = requests.post(
                              f"{server.rstrip('/')}/upload.php",
                              headers=headers,
                              files={"file": (file_name, f)},
                          )

                      if res.status_code == 200 and res.json().get("success"):
                          print(f" -> Uploaded: {file_name}")
                      else:
                          print(f" -> Failed: {file_name} | {res.text}")
                          has_failed = True
                  except Exception as e:
                      print(f" -> Error uploading {file_name}: {e}")
                      has_failed = True

              if has_failed:
                  sys.exit(1)

          if __name__ == "__main__":
              main()
          EOF
