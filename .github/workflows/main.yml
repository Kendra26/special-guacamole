name: Torrent Download & Smart Upload to Filemirage

on:
  push:
    branches:
      - '*'
  workflow_dispatch:

jobs:
  torrent-upload:
    runs-on: ubuntu-latest
    env:
      FILEMIRAGE_API_TOKEN: '9QQH-DGES-CWQZ-FXNV'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt update && sudo apt install -y python3 python3-libtorrent python3-requests

      - name: Download, Zip Conditions & Upload
        run: |
          python3 - << 'EOF'
          import os
          import re
          import sys
          import time
          import shutil
          import zipfile
          import tempfile
          import urllib.request
          import requests
          import libtorrent as lt

          PAGE_URL = "https://equestria-eta.vercel.app/api/pages/dprjjMvC8fCF/raw"
          FILEMIRAGE_TOKEN = os.environ.get("FILEMIRAGE_API_TOKEN", "")

          def zip_directory(dir_path, zip_output_path):
              with zipfile.ZipFile(zip_output_path, 'w', zipfile.ZIP_DEFLATED) as zipf:
                  for root, _, files in os.walk(dir_path):
                      for file in files:
                          full_path = os.path.join(root, file)
                          arcname = os.path.relpath(full_path, dir_path)
                          zipf.write(full_path, arcname)

          def zip_files(file_paths, zip_output_path):
              with zipfile.ZipFile(zip_output_path, 'w', zipfile.ZIP_DEFLATED) as zipf:
                  for fpath in file_paths:
                      zipf.write(fpath, os.path.basename(fpath))

          def main():
              # 1. Create temporary directory
              temp_dir = tempfile.mkdtemp(prefix="torrent_download_")
              print(f"Downloading files to temporary folder: {temp_dir}")

              # 2. Fetch magnet links
              print("Fetching magnet links...")
              req = urllib.request.Request(PAGE_URL, headers={"User-Agent": "Mozilla/5.0"})
              try:
                  with urllib.request.urlopen(req) as response:
                      lines = response.read().decode("utf-8").splitlines()
              except Exception as e:
                  print(f"Failed to fetch page: {e}")
                  sys.exit(1)

              links = [line.strip() for line in lines if line.strip() and not line.startswith("#")]
              if not links:
                  print("No magnet links found.")
                  return

              # 3. Download torrents simultaneously using libtorrent
              ses = lt.session({"listen_interfaces": "0.0.0.0:6881"})
              handles = []

              print(f"Adding {len(links)} magnet link(s) for simultaneous download...")
              for link in links:
                  params = lt.parse_magnet_uri(link)
                  params.save_path = temp_dir
                  handle = ses.add_torrent(params)
                  handles.append(handle)

              print("Resolving metadata...")
              for handle in handles:
                  while not handle.status().has_metadata:
                      time.sleep(1)
                  print(f"Metadata acquired for: {handle.torrent_file().name()}")

              print("\nDownloading simultaneously...")
              while True:
                  all_done = True
                  reports = []
                  for i, handle in enumerate(handles):
                      s = handle.status()
                      if s.progress < 1.0:
                          all_done = False
                      reports.append(f"T{i+1}: {s.progress * 100:.1f}% ({s.download_rate / 1024:.1f} kB/s)")

                  print(" | ".join(reports), end="\r")
                  if all_done:
                      break
                  time.sleep(3)

              print("\n\nAll downloads finished!")

              # 4. Processing logic for Subfolders (>5 files) and Series (>3 files)
              final_upload_files = []

              # Step 4A: Check subdirectories for > 5 files
              for item in os.listdir(temp_dir):
                  full_path = os.path.join(temp_dir, item)
                  if os.path.isdir(full_path):
                      dir_files = []
                      for root, _, files in os.walk(full_path):
                          for f in files:
                              dir_files.append(os.path.join(root, f))

                      if len(dir_files) > 5:
                          zip_name = os.path.join(temp_dir, f"{item}.zip")
                          print(f"Subfolder '{item}' has {len(dir_files)} files (>5). Zipping into '{item}.zip'...")
                          zip_directory(full_path, zip_name)
                          final_upload_files.append(zip_name)
                          shutil.rmtree(full_path)

              # Step 4B: Scan remaining files for TV Series patterns (>3 files)
              remaining_files = []
              for root, _, files in os.walk(temp_dir):
                  for f in files:
                      fpath = os.path.join(root, f)
                      if fpath not in final_upload_files:
                          remaining_files.append(fpath)

              series_regex = re.compile(r'^(.*?)[._\s-]+(?:[sS]\d+|[0-9]+[xX]\d+)', re.IGNORECASE)
              series_groups = {}
              loose_files = []

              for fpath in remaining_files:
                  fname = os.path.basename(fpath)
                  match = series_regex.match(fname)
                  if match:
                      show_title = re.sub(r'[._-]+', ' ', match.group(1)).strip().lower()
                      if show_title not in series_groups:
                          series_groups[show_title] = []
                      series_groups[show_title].append(fpath)
                  else:
                      loose_files.append(fpath)

              for show_title, files in series_groups.items():
                  if len(files) > 3:
                      files.sort()
                      first_file_stem = os.path.splitext(os.path.basename(files[0]))[0]
                      zip_name = os.path.join(temp_dir, f"{first_file_stem}.zip")
                      print(f"Series '{show_title}' has {len(files)} files (>3). Zipping into '{first_file_stem}.zip'...")
                      zip_files(files, zip_name)
                      final_upload_files.append(zip_name)
                      for f in files:
                          if os.path.exists(f):
                              os.remove(f)
                  else:
                      final_upload_files.extend(files)

              final_upload_files.extend(loose_files)

              # 5. Fetch Filemirage server and upload items
              print("\nFetching Filemirage server...")
              try:
                  srv_resp = requests.get("https://filemirage.com/api/servers").json()
                  server = srv_resp.get("data", {}).get("server")
              except Exception as e:
                  print(f"Error connecting to Filemirage API: {e}")
                  sys.exit(1)

              if not server:
                  print("Failed to get valid Filemirage server.")
                  sys.exit(1)

              headers = {"Authorization": f"Bearer {FILEMIRAGE_TOKEN}"}
              print(f"\nUploading {len(final_upload_files)} item(s) to Filemirage...")

              has_failed = False
              for file_path in final_upload_files:
                  if not os.path.isfile(file_path):
                      continue
                  file_name = os.path.basename(file_path)
                  print(f"Uploading: {file_name}")

                  with open(file_path, "rb") as f:
                      res = requests.post(
                          f"{server.rstrip('/')}/upload.php",
                          headers=headers,
                          files={"file": (file_name, f)},
                      )

                  if res.status_code == 200 and res.json().get("success"):
                      print(f" -> Uploaded: {file_name}")
                  else:
                      print(f" -> Failed: {file_name} | {res.text}")
                      has_failed = True

              if has_failed:
                  sys.exit(1)

          if __name__ == "__main__":
              main()
          EOF
